<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>霊人体の健康診断</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f0f4f8;
    }
    .message {
      text-align: center;
      color: #555;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="message">読み込み中...</div>
  <script>
    var FORM_ID = '1c_Ge0Kd5LKYzvGVI76_RqHxm0TXD_7pFzqGcDsvT7Qc';
    var ENTRY_ID = 'entry.413636508';
    var msg = document.querySelector('.message');

    msg.textContent = 'LIFF初期化中...';

    liff.init({ liffId: '2010382843-t71DMNmj' })
      .then(function() {
        msg.textContent = 'ログイン確認中...';
        if (!liff.isLoggedIn()) {
          msg.textContent = 'ログインへ移動中...';
          liff.login();
          return;
        }
        msg.textContent = 'プロフィール取得中...';
        return liff.getProfile();
      })
      .then(function(profile) {
        if (!profile) {
          msg.textContent = 'プロフィールが取得できませんでした';
          return;
        }
        var userId = profile.userId;
        var gasUrl = 'https://script.google.com/macros/s/AKfycbz487b1jtiJhOEC6b701HL9cJFpKRJ6NDsSPbewxr3k6Vz43LgsaabEvfvNas60OFcB/exec?userId=' + encodeURIComponent(userId);
        msg.textContent = 'ブラウザでフォームを開いています...';
        liff.openWindow({ url: gasUrl, external: true });
      })
      .catch(function(err) {
        msg.textContent =
          'エラー: ' + (err.code || '') + ' / ' + (err.message || JSON.stringify(err));
        console.error(err);
      });
  </script>
</body>
</html>
